<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Electrolize&family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mouse+Memoirs&family=Permanent+Marker&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    
<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="avatar-wrap">
     <img src="images/logo.jpg" alt="Hailey Lovejoy" id="profilePhoto" />
      <span class="avatar-initials" id="avatarInitials">LC</span>
    </div>
    <h1>The Locals Chair</h1>
    <p class="hero-sub">Licensed Cosmetologist &nbsp;·&nbsp; Austin, MN</p>
    <a href="tel:5075550000" class="phone-pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      (507) 555-0000
    </a>
  </div>
</div>
 
<!-- MY WORK -->
<div class="divider"><span>My work</span></div>
<div class="gallery-section">
  <div class="gallery">
    <div class="photo-slot">
      <img src="images/gallery-1.jpg" alt="Haircut and style blowout by Hailey" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-2.jpg" alt="Blonding and color correction" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-3jpg.jpg" alt="Full highlight and lowlight service" />
    </div>

    <div class="photo-slot">
      <img src="images/gallery-4.jpg"Balayage and textured layers" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-5.jpg"All-over vivid color transformation" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-6.jpg" alt="Precision bob haircut" />
    </div>

    <div class="photo-slot">
      <img src="images/gallery-7.jpg" alt="Root touch-up and gloss treatment" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-8.jpg" alt="Long layers with curtain bangs" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-9.jpg"Dimensional brunette hair color" />
    </div>

    <div class="photo-slot">
      <img src="images/gallery-10.jpg" alt="Platinum blonde tone and style" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-11.jpg" alt="Men's fade and textured top cut" />
    </div>
    <div class="photo-slot">
      <img src="images/gallery-11.jpg" alt="Special occasion formal updo styling" />
    </div>
  </div>
</div>
 
<!-- BOOKING FORM -->
<div class="divider"><span>Book with me</span></div>
<div class="booking-section">
  <div class="form-card">

    <div id="formWrap">
      <div class="field">
        <label for="clientName">Your name</label>
        <input type="text" id="clientName" placeholder="First and last name" autocomplete="name" />
      </div>

      <div class="field">
        <label for="clientPhone">Phone number</label>
        <input type="tel" id="clientPhone" placeholder="(507) 555-0000" autocomplete="tel" />
      </div>

      <div class="field">
        <label for="service">Service</label>
        <div class="select-wrap">
          <select id="service">
            <option value="" disabled selected>Select a service...</option>
            <option>Haircut</option>
            <option>Highlight / Lowlight</option>
            <option>All over color</option>
            <option>Color Correction / Blonding</option>
            <option>Waxing</option>
            <option>Treatment / Style</option>
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="notes">Anything else? <span style="font-weight:300;text-transform:none;letter-spacing:0;">(optional)</span></label>
        <textarea id="notes" placeholder="Preferred days, times, or anything I should know..."></textarea>
      </div>

      <button class="submit-btn" onclick="submitBooking()">Request appointment</button>
      <button class="submit-btn waitlist-btn" onclick="submitWaitlist()">Join the waitlist</button>
      <p class="form-note">I'll reach out to confirm your appointment!</p>
    </div>
 
    <div class="success-msg" id="successMsg">
      <div class="check">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3 id="successTitle">You're all set!</h3>
      <p id="successText">Hailey will reach out soon to confirm your appointment.</p>
    </div>
 
  </div>
</div>
 
<footer>
  <div class="footer-brand">The Locals Chair</div>
  <div class="footer-copyright">
    Hailey Lovejoy &copy; 2026 &nbsp;·&nbsp;

  </div>
</footer>
 
<script src="home.js"></script>
</body>
</html>
